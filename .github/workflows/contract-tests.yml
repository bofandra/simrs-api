name: Contract and Mock HTTP Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check mock-server.mjs
      - name: Validate OpenAPI coverage
        run: npm run validate:contract
      - name: Run mock API tests
        run: npm test
