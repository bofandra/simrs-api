name: Contract and Mock HTTP Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check mock-server.mjs
      - name: Validate OpenAPI coverage
        run: npm run validate:contract
      - name: Check v3.1 reproducibility and schema contracts
        run: npm run check:v3.1
      - name: Check HOSNEX v3.2 composed OpenAPI and 200 operation coverage
        run: npm run check:v3.2
      - name: Check HOSNEX v3.3 13 P0 endpoint proposals and 200 v3.2 backward compatibility
        run: npm run check:v3.3
      - name: Check HOSNEX v3.4 remaining 34 action contract proposals
        run: npm run check:v3.4
      - name: Check HOSNEX v3.5 29 partial action endpoint alignments
        run: npm run check:v3.5
      - name: Run mock API tests
        run: npm test
