name: Contract Tests and VPS Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Syntax check
        run: node --check mock-server.mjs
      - name: Validate OpenAPI coverage
        run: npm run validate:contract
      - name: Check v3.1 reproducibility and schema contracts
        run: npm run check:v3.1
      - name: Check HOSNEX v3.2 composed OpenAPI and 200 operation coverage
        run: npm run check:v3.2
      - name: Check HOSNEX v3.3 13 P0 endpoint proposals and 200 v3.2 backward compatibility
        run: npm run check:v3.3
      - name: Check HOSNEX v3.4 remaining 34 action contract proposals
        run: npm run check:v3.4
      - name: Check HOSNEX v3.5 29 partial action endpoint alignments
        run: npm run check:v3.5
      - name: Check PRD 4.0 acceptance inventory and operation traceability
        run: npm run check:v4
      - name: Run mock API tests
        run: npm test

  deploy:
    needs: contract
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vps
    concurrency:
      group: simrs-api-vps
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS is required}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY is required}"

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/deploy_key"

          ssh -T -i "$ssh_dir/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "simrs-api-deploy@$VPS_HOST" "$GITHUB_SHA"
